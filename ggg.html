</head>

<script>

d:[()=>{[0,.4,.72,1,1.22,1.4,1.55].forEach(d=>{tone(95,35,.16,'sine',.55,d);tone(80,30,.14,'sine',.45,d+.12)});nz(1.4,.6,3200,1.85,50);tone(260,18,1.5,'sawtooth',.35,1.85)},
()=>{[0,.22,.4,.55,.67,.77,.85,.9].forEach((d,i)=>{nz(.06,.5,5000,d,800);tone(900+i*70,300,.04,'square',.1,d)});nz(.9,.6,2500,.95,80);tone(220,25,.8,'sawtooth',.35,.95);[1.1,1.18,1.3,1.42,1.6].forEach(d=>nz(.04,.3,3000,d,600))},
()=>{[0,.55,1.1,1.65].forEach((d,i)=>{tone([196,175,147,98][i],[110,98,80,49][i],.55,'sawtooth',.2,d);tone([200,178,150,100][i],[112,100,82,50][i],.55,'square',.08,d)});nz(2.2,.25,700,0,120);tone(70,20,.6,'sine',.5,1.9)}]};
/* effects */
const BC=['#a3122a','#ff3b3b','#5a0a14','#7a0f20'];

function start(){au();score=0;kills=0;kp=0;stage=1;LV=1;xp=0;spawnT=1;boss=null;slow=0;lv=[0,0,0,0,0,0];cn=[0,0,0,0,0,0];Object.assign(P,{pw:1,inv:1.5,cd:0,hp:300,sh:0,beam:0,bt:0});
  bullets=[];ebul=[];enemies=[];parts=[];pups=[];rings=[];BX.clearRect(0,0,GW,GH);P.x=P.tx=GW/2;P.y=P.ty=GH*.8;bn={l:['STAGE 1'],t:2};state='play';ov.classList.add('hide')}
